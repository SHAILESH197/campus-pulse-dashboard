<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campus Pulse Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    background:
        linear-gradient(135deg, rgba(106,17,203,0.88), rgba(37,117,252,0.88)),
        url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1600&q=80");
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 10% 15%, rgba(255,255,255,0.18), transparent 18%),
        radial-gradient(circle at 90% 85%, rgba(255,255,255,0.14), transparent 20%);
    pointer-events: none;
}

.login-card {
    position: relative;
    width: 520px;
    background: rgba(255,255,255,0.96);
    border-radius: 18px;
    padding: 42px 52px 28px;
    text-align: center;
    box-shadow: 0 28px 70px rgba(15, 23, 42, 0.35);
}

.logo {
    font-size: 54px;
    color: #6d28d9;
    margin-bottom: 8px;
}

h1 {
    margin: 0;
    font-size: 42px;
    color: #0f172a;
    letter-spacing: -1px;
}

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 22px 0 12px;
    color: #6d28d9;
    font-size: 28px;
    font-weight: bold;
}

.divider::before,
.divider::after {
    content: "";
    height: 2px;
    width: 145px;
    background: #e2e8f0;
    margin: 0 14px;
}

.sub {
    color: #64748b;
    font-size: 15px;
    margin-bottom: 28px;
}

.error {
    display: none;
    background: #fee2e2;
    color: #dc2626;
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 15px;
    font-size: 14px;
}

.input-box {
    position: relative;
    margin-bottom: 22px;
}

.input-box input {
    width: 100%;
    padding: 18px 52px;
    border-radius: 12px;
    border: 1px solid #cbd5e1;
    outline: none;
    font-size: 16px;
    color: #0f172a;
    background: rgba(255,255,255,0.9);
}

.input-box input:focus {
    border-color: #7c3aed;
    box-shadow: 0 0 0 3px rgba(124,58,237,0.16);
}

.icon-left {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #6d28d9;
    font-size: 20px;
}

.icon-right {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #64748b;
    font-size: 18px;
    cursor: pointer;
}

.login-btn {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 12px 28px rgba(79,70,229,0.35);
    transition: 0.25s;
}

.login-btn:hover {
    transform: translateY(-2px);
}

.footer-line {
    height: 1px;
    background: #e2e8f0;
    margin: 34px 0 20px;
}

.footer {
    color: #64748b;
    font-size: 14px;
}

@media(max-width: 600px) {
    .login-card {
        width: 90%;
        padding: 35px 25px;
    }

    h1 {
        font-size: 34px;
    }

    .divider::before,
    .divider::after {
        width: 80px;
    }
}
</style>
</head>

<body>

<div class="login-card">
    <div class="logo">🎓</div>

    <h1>Campus Pulse</h1>

    <div class="divider">⌁</div>

    <p class="sub">Admin login to access the student satisfaction dashboard.</p>

    <div class="error" id="error">Invalid username or password.</div>

    <div class="input-box">
        <span class="icon-left">👤</span>
        <input type="text" id="username" value="admin">
    </div>

    <div class="input-box">
        <span class="icon-left">🔒</span>
        <input type="password" id="password" placeholder="Enter password">
        <span class="icon-right" onclick="togglePassword()">👁</span>
    </div>

    <button type="button" class="login-btn" onclick="login()">Login</button>

    <div class="footer-line"></div>

    <div class="footer">© Campus Pulse | All Rights Reserved</div>
</div>

<script>
function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (user === "admin" && pass === "Shailesh@2005") {
        localStorage.setItem("campusPulseLogin", "true");
        window.location.href = "index.html";
    } else {
        document.getElementById("error").style.display = "block";
    }
}

function togglePassword() {
    const password = document.getElementById("password");
    password.type = password.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
